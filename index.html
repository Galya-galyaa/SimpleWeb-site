<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&family=Ubuntu:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">
                <img src="img/for_header/ellipse1.svg" alt="" class="header__logo-icon">
                <span class="header__logo-text">simple</span>
                <img src="img/for_header/ellipse2.svg" alt="" class="header__logo-icon">
                <img src="img/for_header/ellipse3.svg" alt="" class="header__logo-icon">
            </a>
            <div class="header__nav-block">
                <nav class="header__nav">
                    <ul class="header__nav-list">
                        <li class="header__nav-item"><a href="#" class="header__nav-link">Продукция</a></li>
                        <li class="header__nav-item"><a href="#" class="header__nav-link">Материалы</a></li>
                        <li class="header__nav-item"><a href="#" class="header__nav-link">О нас</a></li>
                        <li class="header__nav-item"><a href="#" class="header__nav-link">Контакты</a></li>
                    </ul>
                </nav>

            <div class="header__actions">
                <button class="header__action-btn" aria-label="Поиск">
                    <img src="img/for_header/search.svg" alt="" class="header__action-icon">
                </button>
                <button class="header__action-btn" aria-label="Войти">
                    <img src="img/for_header/log_in.svg" alt="" class="header__action-icon">
                </button>
            </div>
        </div>
    </div>
    </header>

    <section class="hero">
        <div class="hero__container">
            <div class="hero__content">
                <h1 class="hero__title">Простые вещи.<br>Из бумаги</h1>
                <p class="hero__text">
                    Бума́га (предположительно от итал. bombagia, первоисточником же считается иранский) — волокнистый материал с минеральными добавками.
                </p>
                <a href="#" class="hero__button">Каталог</a>
            </div>

            <div class="hero__image-wrapper">
                <img src="img/for_next_block/paper-simple.svg" alt="Простые вещи из бумаги" class="hero__image">
            </div>

        </div>
    </section>

    

</body>
</html>
