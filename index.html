<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple</title>
    
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">
                <img src="img/for_header/ellipse1.svg" alt="" class="header__logo-icon">
                <span class="header__logo-text">simple</span>
                <img src="img/for_header/ellipse2.svg" alt="" class="header__logo-icon">
                <img src="img/for_header/ellipse3.svg" alt="" class="header__logo-icon">
            </a>
            <div class="header__nav-block">
                <nav class="header__nav">
                    <ul class="header__nav-list">
                        <li class="header__nav-item"><a href="#" class="header__nav-link">Продукция</a></li>
                        <li class="header__nav-item"><a href="#" class="header__nav-link">Материалы</a></li>
                        <li class="header__nav-item"><a href="#" class="header__nav-link">О нас</a></li>
                        <li class="header__nav-item"><a href="#" class="header__nav-link">Контакты</a></li>
                    </ul>
                </nav>

            <div class="header__actions">
                <button class="header__action-btn" aria-label="Поиск">
                    <img src="img/for_header/search.svg" alt="" class="header__action-icon">
                </button>
                <button class="header__action-btn" aria-label="Войти">
                    <img src="img/for_header/log_in.svg" alt="" class="header__action-icon">
                </button>
            </div>
        </div>
    </div>
    <img src="img/for_header/line1.svg" alt="" class="header__line">
</header>
</body>
</html>
